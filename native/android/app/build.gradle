// App module (merged, additive). Every dependency below has a reason; see docs/DEPENDENCIES.md.

// Order matters: kapt needs the Kotlin Android plugin applied first. (APK Maker's own kotlin step
// adds the same first line; the merger skips lines that already exist.)
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-kapt'

android {
    defaultConfig {
        // youtubedl-android (yt-dlp + Python + FFmpeg) requires API 24. Capacitor's own minimum is 23.
        minSdkVersion 24
        ndk {
            // Real phones only (arm64 + 32-bit ARM). Add 'x86_64' here for an emulator build.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    packaging {
        jniLibs {
            // yt-dlp's Python, FFmpeg and QuickJS are executables shipped as .so files; Android must
            // extract them to disk so they can be run.
            useLegacyPackaging = true
        }
    }
    compileOptions {
        // Required by NewPipeExtractor on minSdk < 33 (java.time / nio backports).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/*.md']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // YouTube extraction (isolated behind core/extraction/VideoExtractor)
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Playback (Phase 3). hls = live streams; guava = ListenableFuture used by MediaController.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.google.guava:guava:33.3.1-android'

    // Phase 5: downloads
    // yt-dlp + FFmpeg + Python + QuickJS (GPL-3.0). yt-dlp downloads; FFmpeg merges/converts only.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    // Persistent download queue (metadata only). Room's annotation processor runs through kapt.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    // Writing to a user-chosen folder (Storage Access Framework) without broad storage permission.
    implementation 'androidx.documentfile:documentfile:1.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
